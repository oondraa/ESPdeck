; Testovací firmware ESPDeck – obrazovky Hodiny a Nastavení z Display Designeru.
; Deska: LaskaKit ESP32-S3-DevKit (ESP32-S3-WROOM-1 N16, 16 MB flash), USB-UART CH9102.
; Build + nahrání:  pio run -t upload      Sériový monitor:  pio device monitor

[platformio]
default_envs = s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8

[env:s3]
lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.2.0

; Diagnostika: najde piny SDA/SCL displeje
[env:i2cscan]
build_flags = -DI2C_PIN_SCAN
